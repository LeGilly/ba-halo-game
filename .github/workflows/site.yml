# Actions are pinned to exact commits (the comment shows the version) so a changed tag can't alter this job.
# Copies new halos from the Blue Archive Wiki into halos/ every Wednesday, then publishes the site.
# Also runs on every push to main, and on demand: Actions tab -> "Update halos and deploy" -> Run workflow.
name: Update halos and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"   # every Wednesday at 04:17 UTC (05:17 in Paris, 06:17 in summer)
  workflow_dispatch:

# Nothing is allowed by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-halos:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the last step, to save new halos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the updater below runs without any access to the repository

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Update halos from the wiki
        # If the wiki is unreachable, keep going and publish the halos we already have.
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python tools/update_halos.py

      - name: Save new halos to the repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain halos)" ]; then
            echo "No halo changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add halos
          git commit -m "Update halos from the wiki"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$url" main
          git push "$url" HEAD:main

  deploy:
    needs: update-halos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish the site
      id-token: write   # required by GitHub Pages publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main                    # include the halos just saved
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5