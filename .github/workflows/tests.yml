# Actions are pinned to exact commits (the comment shows the version) so a changed tag can't alter this job.
# Runs the tests (see MAINTAINING.md, Tests) on every push and on demand: Actions tab -> "Tests" -> Run workflow.
# It only reports ✓ or ✗; publishing the site doesn't wait for it.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install the test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm test

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: test-results/
          retention-days: 7
